                </div>
                <div class="absolute top-4 left-4">

                        <span class="material-symbols-outlined text-3xl">arrow_back</span>

                </div>
                <div class="absolute top-4 right-4">
                    <button

                </div>
                <div class="relative">
                    <h1 class="text-5xl font-extrabold tracking-tight drop-shadow-md">Nuevo Puzzle</h1>
                    <p class="mt-3 text-lg opacity-90 drop-shadow-sm">Crea tu obra maestra</p>
                </div>
            </div>
            <div class="flex-grow w-full max-w-md mx-auto px-4 sm:px-6 -mt-16">
                <div class="space-y-6">
                    <div
                        class="rounded-2xl bg-white/70 backdrop-blur-lg p-6 shadow-xl border border-white/30 transition-all duration-300 hover:shadow-2xl hover:-translate-y-1">
                        <div class="flex items-center gap-4 mb-5">
                            <div
                                class="w-14 h-14 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg">
                                <span class="material-symbols-outlined text-white text-4xl">photo_library</span>
                            </div>
                            <div>
                                <h3 class="text-2xl font-bold text-gray-800">Desde tus Fotos</h3>
                                <p class="text-sm text-gray-500 font-medium">Sube tu propia imagen</p>
                            </div>
                        </div>

                        <!-- Input oculto para subir imagen -->
                        <input type="file" id="imageInput" accept="image/*" class="hidden">

                        <button onclick="document.getElementById('imageInput').click()"
                            class="flex w-full items-center justify-center gap-3 rounded-xl bg-gradient-to-r from-indigo-500 to-purple-600 px-4 py-4 text-lg font-bold text-white shadow-lg hover:shadow-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition-all duration-300 transform hover:scale-105 cursor-pointer border-none">
                            <span>Elegir de la Galería</span>
                            <span class="material-symbols-outlined">arrow_forward</span>
                        </button>
                    </div>
                    <div class="relative py-2">
                        <div aria-hidden="true" class="absolute inset-0 flex items-center">
                            <div class="w-full border-t border-gray-300/70 border-dashed"></div>
                        </div>
                        <div class="relative flex justify-center">
                            <span
                                class="bg-violet-50 px-4 text-sm font-semibold text-gray-500 uppercase tracking-wider">O</span>
                        </div>
                    </div>
                    <div
                        class="rounded-2xl bg-white/70 backdrop-blur-lg p-6 shadow-xl border border-white/30 transition-all duration-300 hover:shadow-2xl hover:-translate-y-1">
                        <div class="flex items-center gap-4 mb-3">
                            <div
                                class="w-14 h-14 rounded-2xl bg-gradient-to-br from-pink-500 to-rose-600 flex items-center justify-center shadow-lg">
                                <span class="material-symbols-outlined text-white text-4xl">auto_awesome</span>
                            </div>
                            <div>
                                <h3 class="text-2xl font-bold text-gray-800">Con IA Mágica</h3>
                                <p class="text-sm text-gray-500 font-medium">Potenciado por Creative Canvas</p>
                            </div>
                        </div>
                        <div class="space-y-4 mt-5">
                            <label class="sr-only" for="ai-prompt">Prompt IA</label>
                            <div class="relative">
                                <span
                                    class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-2xl">palette</span>
                                <input
                                    class="block w-full rounded-xl border-gray-300/80 shadow-inner focus:border-pink-500 focus:ring-pink-500 sm:text-base h-16 pl-14 pr-4 placeholder:text-gray-400"
                                    id="ai-prompt" placeholder="ej., 'un gato con sombrero de mago'" type="text" />
                            </div>
                            <button id="btn-generate-ai"
                                class="flex w-full items-center justify-center gap-3 rounded-xl bg-gradient-to-r from-pink-500 to-rose-600 px-4 py-4 text-lg font-bold text-white shadow-lg hover:shadow-xl focus:outline-none focus:ring-2 focus:ring-pink-500 focus:ring-offset-2 transition-all duration-300 transform hover:scale-105 border-none cursor-pointer disabled:opacity-70 disabled:cursor-not-allowed">
                                <span id="btn-text-ai">Generar Imagen</span>
                                <span id="btn-icon-ai" class="material-symbols-outlined">auto_awesome</span>
                                <!-- Spinner de carga (oculto por defecto) -->
                                <svg id="spinner-ai" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white hidden"
                                    xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor"
                                        stroke-width="4"></circle>
                                    <path class="opacity-75" fill="currentColor"
                                        d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                                    </path>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Sección de Historial -->
                    <div id="history-section" class="hidden">
                        <div class="relative py-4">
                            <div aria-hidden="true" class="absolute inset-0 flex items-center">
                                <div class="w-full border-t border-gray-300/70 border-dashed"></div>
                            </div>
                            <div class="relative flex justify-center">
                                <span
                                    class="bg-violet-50 px-4 text-sm font-semibold text-gray-500 uppercase tracking-wider">Tus
                                    Creaciones</span>
                            </div>
                        </div>

                        <div class="rounded-2xl bg-white/70 backdrop-blur-lg p-6 shadow-xl border border-white/30">
                            <div class="grid grid-cols-3 gap-3" id="history-grid">
                                <!-- Las imágenes se cargarán aquí dinámicamente -->
                            </div>
                            <button onclick="clearHistory()"
                                class="mt-6 flex w-full items-center justify-center gap-3 rounded-xl bg-gradient-to-r from-red-500 to-red-600 px-4 py-4 text-lg font-bold text-white shadow-lg hover:shadow-xl focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 transition-all duration-300 transform hover:scale-105 border-none cursor-pointer">
                                <span>Borrar historial</span>
                                <span class="material-symbols-outlined text-2xl">delete_sweep</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <script>
                // Lógica de Historial
                const MAX_HISTORY = 6;

                function getHistory() {
                    const stored = localStorage.getItem('puzzleImageHistory');
                    return stored ? JSON.parse(stored) : [];
                }

                function saveToHistory(imageData) {
                    let history = getHistory();

                    // Evitar duplicados consecutivos
                    if (history.length > 0 && history[0] === imageData) return;

                    // Agregar al inicio
                    history.unshift(imageData);

                    // Limitar tamaño
                    if (history.length > MAX_HISTORY) {
                        history = history.slice(0, MAX_HISTORY);
                    }

                    localStorage.setItem('puzzleImageHistory', JSON.stringify(history));
                }

                function deleteImage(index, event) {
                    event.stopPropagation(); // Evitar que se active el click de la imagen

                    if (!confirm('¿Borrar esta imagen?')) return;

                    let history = getHistory();
                    history.splice(index, 1);
                    localStorage.setItem('puzzleImageHistory', JSON.stringify(history));
                    loadHistory();
                }

                function loadHistory() {
                    const history = getHistory();
                    const container = document.getElementById('history-grid');
                    const section = document.getElementById('history-section');

                    if (history.length === 0) {
                        section.classList.add('hidden');
                        return;
                    }

                    section.classList.remove('hidden');
                    container.innerHTML = '';

                    history.forEach((imgData, index) => {
                        const div = document.createElement('div');
                        // Aspect ratio 9:16 (vertical mobile) -> aspect-[9/16]
                        div.className = 'relative group aspect-[9/16] rounded-lg overflow-hidden cursor-pointer shadow-md hover:shadow-lg hover:ring-2 hover:ring-indigo-500 transition-all duration-200 transform hover:scale-105 bg-gray-100';

                        div.innerHTML = `
                            <img src="${imgData}" class="w-full h-full object-cover" alt="Creación guardada ${index + 1}">

                                <!-- Botón de eliminar individual -->
                                <button onclick="deleteImage(${index}, event)" class="absolute top-1 right-1 w-6 h-6 bg-red-500 text-white rounded-full flex items-center justify-center shadow-sm opacity-0 group-hover:opacity-100 transition-opacity duration-200 hover:bg-red-600 focus:outline-none">
                                    <span class="material-symbols-outlined text-sm">close</span>
                                </button>
                                `;

                        // Click en la imagen para jugar (evitando el botón de borrar)
                        div.onclick = (e) => {
                            if (e.target.closest('button')) return;
                            selectHistoryImage(imgData);
                        };
                        container.appendChild(div);
                    });
                }

                function selectHistoryImage(imageData) {
                    // No volvemos a guardar en historial al seleccionar, solo jugamos
                    localStorage.setItem('customPuzzleImage', imageData);
                    window.location.href = 'puzzle.html';
                }

                function clearHistory() {
                    if (confirm('¿Estás seguro de borrar todo tu historial de imágenes?')) {
                        localStorage.removeItem('puzzleImageHistory');
                        loadHistory();
                    }
                }

                // Cargar historial al iniciar
                document.addEventListener('DOMContentLoaded', loadHistory);

                // Lógica configuración de imagen común
                function saveImageAndPlay(imageData) {
                    saveToHistory(imageData); // Guardar historial antes de jugar
                    localStorage.setItem('customPuzzleImage', imageData);
                    window.location.href = 'puzzle.html';
                }

                // 1. Carga de imagen local (PC)
                document.getElementById('imageInput').addEventListener('change', function (e) {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = function (event) {
                            saveImageAndPlay(event.target.result);
                        };
                        reader.readAsDataURL(file);
                    }
                });

                // 2. Generación con IA
                document.getElementById('btn-generate-ai').addEventListener('click', async function () {
                    const promptInput = document.getElementById('ai-prompt');
                    const prompt = promptInput.value.trim();

                    if (!prompt) {
                        alert('Por favor escribe una descripción para la imagen mágica.');
                        promptInput.focus();
                        return;
                    }

                    // UI Loading State
                    const btn = this;
                    const btnText = document.getElementById('btn-text-ai');
                    const btnIcon = document.getElementById('btn-icon-ai');
                    const spinner = document.getElementById('spinner-ai');

                    btn.disabled = true;
                    btnText.textContent = 'Creando magia...';
                    btnIcon.classList.add('hidden');
                    spinner.classList.remove('hidden');

                    try {
                        // Usar Pollinations.ai (gratuito, sin key)
                        // Añadimos seed aleatorio para variedad
                        const seed = Math.floor(Math.random() * 1000);
                        const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=800&height=800&nologo=true&seed=${seed}`;

                        // Fetch para obtener el blob y evitar problemas de CORS/Canvas sucios al guardar
                        const response = await fetch(imageUrl);
                        if (!response.ok) throw new Error('Error generando imagen');

                        const blob = await response.blob();
                        const reader = new FileReader();

                        reader.onloadend = function () {
                            saveImageAndPlay(reader.result);
                        };

                        reader.readAsDataURL(blob);

                    } catch (error) {
                        console.error('Error IA:', error);
                        alert('Hubo un problema creando tu imagen mágica. Intenta de nuevo.');

                        // Reset UI
                        btn.disabled = false;
                        btnText.textContent = 'Generar Imagen';
                        btnIcon.classList.remove('hidden');
                        spinner.classList.add('hidden');
                    }
                });
            </script>
        </main>
